# Production (`docs/03-architecture-technique.md` § 9) : Caddy (HTTPS) devant Django (gunicorn),
# Celery, Redis, PostgreSQL. Seul Caddy est ouvert sur l'extérieur (ports 80 et 443).
# Valeurs de l'essai : `infra/local.env` (`make prod-local`) ; vrai serveur : `make deploy`, avec `docker-compose.production.yml`.
# Sur la machine : `make prod-local` (valeurs de `infra/local.env`).
name: mwangaza

x-logging: &logging
  # Journaux des conteneurs limités : le disque du VPS ne se remplit pas.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Mémoire (PERF.5a) : serveur de 2 Go, 2 Go de swap. Chaque conteneur a une limite ET la même
# limite swap comprise (`memswap_limit`) : un conteneur qui déborde est arrêté et relancé seul au
# lieu de ralentir toute la machine. Somme des limites ≈ 1,78 Go, ≈ 300 Mo laissés au système
# (`migrate`, 384m, ne tourne qu'au démarrage). Ces limites valent aussi pour `make prod-local`,
# pour mesurer comme sur le serveur (`make perf`).
x-backend: &backend
  build:
    context: ..
    dockerfile: infra/Dockerfile
    target: backend
  image: mwangaza-backend
  restart: unless-stopped
  logging: *logging
  environment: &backend-env
    MWANGAZA_DOMAIN: ${MWANGAZA_DOMAIN:?MWANGAZA_DOMAIN manque dans infra/.env}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY manque dans infra/.env}
    DJANGO_SECRET_KEY_FALLBACKS: ${DJANGO_SECRET_KEY_FALLBACKS:-}
    DJANGO_ALLOWED_HOSTS: .${MWANGAZA_DOMAIN}
    DJANGO_SCHOOL_BASE_DOMAINS: ${MWANGAZA_DOMAIN}
    DJANGO_SCHOOL_URL: https://{code}.${MWANGAZA_DOMAIN}
    DJANGO_PORTAL_URL: https://parents.${MWANGAZA_DOMAIN}
    DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-2592000}
    DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    SENTRY_DSN: ${SENTRY_DSN:-}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
    POSTGRES_DB: mwangaza
    # Compte de l'application (S.5) : ni superutilisateur ni propriétaire des tables, des lignes
    # seulement. Le mot de passe du propriétaire (`POSTGRES_PASSWORD`) n'est que dans `migrate`.
    POSTGRES_USER: mwangaza_app
    POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD manque dans infra/.env}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
    WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
    # Espaces de démonstration créés depuis la console (4.17.2) ; vide : 5.
    DJANGO_DEMO_SPACES_MAX: ${DJANGO_DEMO_SPACES_MAX:-}
    # Adresses d'où le compte super-admin peut être utilisé (S.3.1) ; vide : toutes.
    DJANGO_CONSOLE_ALLOWED_IPS: ${DJANGO_CONSOLE_ALLOWED_IPS:-}
  # Logos, photos, pièces jointes : sur le disque jusqu'au stockage objet (4.7).
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    migrate:
      condition: service_completed_successfully

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: caddy
    image: mwangaza-caddy
    mem_limit: 64m
    memswap_limit: 64m
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      MWANGAZA_DOMAIN: ${MWANGAZA_DOMAIN}
      CADDY_TLS: ${CADDY_TLS:?CADDY_TLS manque dans infra/.env}
      CSP_HEADER: ${CSP_HEADER:-Content-Security-Policy-Report-Only}
    volumes:
      # Dossier des certificats de l'essai local (`make prod-local`), jamais dans Git ; le vrai serveur obtient son certificat joker lui-même (`production/Caddyfile`).
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      django:
        condition: service_healthy

  django:
    <<: *backend
    mem_limit: 576m
    memswap_limit: 576m
    environment:
      <<: *backend-env
      # Garde-fou (PERF.1) : une requête de la base de plus de 25 s est coupée, jamais de
      # transaction ouverte sans rien faire plus de 30 s : le site ne reste pas bloqué dessus.
      DB_STATEMENT_TIMEOUT_MS: "25000"
    healthcheck:
      # Sonde de l'API (base comprise), comme si la requête venait de Caddy en HTTPS.
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; r.urlopen(r.Request('http://localhost:8000/api/health/', headers={'Host': 'admin.' + os.environ['MWANGAZA_DOMAIN'], 'X-Forwarded-Proto': 'https'}), timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 60s

  # Tâches courantes (PERF.5a) : file `celery` (notifications, purges, passage du planificateur),
  # 2 travailleurs. Un travailleur est renouvelé après 100 tâches ou si sa mémoire dépasse 150 Mo
  # (le seuil est lu sur la mémoire du travailleur, qui partage déjà ≈ 60 Mo avec le processus
  # principal : 75 + 2 × ≈ 110 reste sous la limite du conteneur, 288 Mo, avec de la marge).
  worker:
    <<: *backend
    mem_limit: 288m
    memswap_limit: 288m
    command: celery -A config worker -Q celery -n worker@%h --loglevel=info --concurrency=2 --max-tasks-per-child=100 --max-memory-per-child=150000

  # Tâches lourdes : file `heavy` (PDF, import d'une liste, espaces de démonstration), UN seul
  # travail à la fois, renouvelé tous les 5 travaux ou au-delà de 240 Mo ; limite du conteneur
  # 384 Mo : processus principal ≈ 75 Mo + un travail (une tranche de 8 pages ≈ 220 Mo).
  worker-heavy:
    <<: *backend
    mem_limit: 384m
    memswap_limit: 384m
    command: celery -A config worker -Q heavy -n heavy@%h --loglevel=info --concurrency=1 --max-tasks-per-child=5 --max-memory-per-child=240000

  # Planificateur (relances, purges de la nuit) : un petit service à part, qu'aucun travailleur
  # ne peut plus emporter en s'arrêtant. Il ne fait qu'envoyer les tâches aux travailleurs.
  scheduler:
    <<: *backend
    mem_limit: 144m
    memswap_limit: 144m
    command: celery -A config beat -s /tmp/celerybeat-schedule --loglevel=info

  # Migrations (un seul serveur), puis droits du compte de l'application : seul conteneur qui a le
  # compte propriétaire des tables. Il tourne à chaque `up`, avant `django` et `celery`, et s'arrête.
  migrate:
    <<: *backend
    restart: "no"
    mem_limit: 384m
    memswap_limit: 384m
    command: sh -c "python manage.py migrate --noinput && python manage.py setup_app_role"
    environment:
      <<: *backend-env
      POSTGRES_USER: mwangaza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manque dans infra/.env}
      POSTGRES_APP_USER: mwangaza_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    memswap_limit: 256m
    # Réglé pour 256 Mo (PERF.5a) : tampons 96 Mo, tri 4 Mo par opération, 40 connexions au plus
    # (django 2 × 4 fils, travailleurs, migrations) ; `pg_stat_statements` garde les requêtes les
    # plus lentes (extension créée par `setup_app_role`).
    command: >
      postgres
      -c shared_buffers=96MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=448MB
      -c max_connections=40
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=1000
      -c track_io_timing=on
    environment:
      POSTGRES_DB: mwangaza
      POSTGRES_USER: mwangaza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwangaza -d mwangaza"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    memswap_limit: 64m
    # Plafond de 48 Mo : file des tâches, compteurs de limite de débit et mesures de santé. Jamais
    # d'éviction d'une clé sans durée de vie : la file des tâches et les dates de sauvegarde ne
    # disparaissent pas ; seuls les compteurs (qui expirent seuls) peuvent être évincés. Copie sur
    # disque (RDB) gardée : les dates de sauvegarde survivent à un redémarrage, et à ce volume (quelques
    # Mo) la copie du processus tient largement dans la marge de 16 Mo.
    command: redis-server --maxmemory 48mb --maxmemory-policy volatile-lru --save 900 1 --save 300 100
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
  media:
  caddy-data:
  caddy-config:
