# Adresse DuckDNS et vrai certificat joker, ajouté à `docker-compose.yml`, pour :
# - l'essai sur plusieurs appareils du même réseau (`make reseau`, tâche 4.11) : valeurs dans
#   `infra/reseau/reseau.env` ;
# - le serveur de démonstration en ligne (`make deploy`, tâche 4.6.2) : valeurs dans
#   `infra/serveur/serveur.env`, avec un mot de passe des comptes fictifs propre au serveur.
# Les deux fichiers sont hors Git et créés avec des secrets neufs. Jamais pour de vraies écoles :
# elles attendent le vrai domaine et les sauvegardes (4.6.3, 4.7).
services:
  caddy:
    build:
      target: caddy-reseau
    image: mwangaza-caddy-reseau
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DUCKDNS_TOKEN manque dans le fichier de valeurs}
    volumes:
      # Page d'accueil avec les QR codes (écrite par `infra/reseau/essai.py accueil`).
      - ${ACCUEIL:-./reseau/accueil}:/srv/accueil:ro

  django:
    environment:
      DJANGO_DEMO_DATA: "true"
      # Vide (essai sur le réseau) : mot de passe et clé de double authentification du dépôt.
      DJANGO_DEMO_PASSWORD: ${DJANGO_DEMO_PASSWORD:-}
    volumes:
      # Logos des écoles de démonstration (`apps/schools/demo.py`).
      - ../docs/ecole-pilote/documents:/docs/ecole-pilote/documents:ro
