# Vrai serveur (AWS Lightsail, 4.6.3), ajouté à `docker-compose.yml` par `make deploy`.
# Pas de données fictives.
# Démarrage au boot et relance après un plantage : Docker (service activé par `preparer.sh`) +
# `restart: unless-stopped` de chaque service ; pas de service systemd en plus.
services:
  caddy:
    build:
      target: caddy-production
    image: mwangaza-caddy-production
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN manque dans serveur.env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manque dans serveur.env}
