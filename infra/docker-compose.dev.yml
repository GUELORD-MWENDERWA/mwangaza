# Développement : tout Mwangaza en une commande (`make dev`).
# Gestion : http://itig.localhost:5173/app/ · Portail : http://localhost:5174/ · API : http://localhost:8000/api/
name: mwangaza-dev

x-backend: &backend
  build:
    context: ../backend
    dockerfile: Dockerfile.dev
  volumes:
    - ../backend:/app
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    POSTGRES_DB: mwangaza
    POSTGRES_USER: mwangaza
    POSTGRES_PASSWORD: mwangaza
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mwangaza
      POSTGRES_USER: mwangaza
      POSTGRES_PASSWORD: mwangaza
    ports:
      - "5433:5432" # 5433 sur la machine : le PostgreSQL installé localement garde le 5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwangaza -d mwangaza"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  celery:
    <<: *backend
    command: celery -A config worker --loglevel=info

  frontend:
    image: node:22-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm dev"
    environment:
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VITE_HOST: 0.0.0.0
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
      - "5174:5174"
    depends_on:
      - backend

volumes:
  db-data:
