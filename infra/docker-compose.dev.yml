# Développement : tout Mwangaza en une commande (`make dev`).
# Gestion : http://itig.localhost:5173/app/ · Portail : http://localhost:5174/ · API : http://localhost:8000/api/
name: mwangaza-dev

x-backend: &backend
  build:
    context: ../backend
    dockerfile: Dockerfile.dev
  volumes:
    - ../backend:/app
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    POSTGRES_DB: mwangaza
    POSTGRES_USER: mwangaza
    POSTGRES_PASSWORD: mwangaza
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mwangaza
      POSTGRES_USER: mwangaza
      POSTGRES_PASSWORD: mwangaza
    ports:
      - "5433:5432" # 5433 sur la machine : le PostgreSQL installé localement garde le 5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwangaza -d mwangaza"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  celery:
    <<: *backend
    command: celery -A config worker --loglevel=info

  frontend:
    image: node:22-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    # Pas d'installation ici : le conteneur utilise le node_modules installé sur la machine
    # (`make dev` lance `pnpm install` avant). Installer dans le conteneur réécrirait ce
    # node_modules avec un store qui n'existe que dans Docker, et tout retéléchargerait.
    # `corepack enable` met `pnpm` dans le PATH : le script `pnpm dev` rappelle `pnpm`.
    command: sh -c "mkdir -p /tmp/bin && corepack enable --install-directory /tmp/bin && pnpm dev"
    environment:
      HOME: /tmp
      PATH: /tmp/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Dans node_modules (ignoré par Git) : pnpm n'est téléchargé qu'une fois.
      COREPACK_HOME: /app/node_modules/.corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Sinon `pnpm dev` réinstalle tout avant de démarrer (pnpm 12 lit `pnpm_config_*`).
      pnpm_config_verify_deps_before_run: "false"
      VITE_HOST: 0.0.0.0
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
      - "5174:5174"
    depends_on:
      - backend

volumes:
  db-data:
