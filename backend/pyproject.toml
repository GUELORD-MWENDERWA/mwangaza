[project]
name = "mwangaza-backend"
version = "0.1.0"
description = "API Django de Mwangaza"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "django>=5.2,<5.3",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pywebpush>=2.5.0",
    "redis>=8.1.0",
    "segno>=1.6",
    "sentry-sdk>=2.72.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I imports triés, UP syntaxe moderne, B bugs probables,
# DJ règles Django, SIM simplifications, RUF règles propres à ruff.
select = ["E", "W", "F", "I", "UP", "B", "DJ", "SIM", "RUF"]
# RUF012 : les listes de configuration de Django (Meta, admin, serializers) sont des attributs de
# classe par conception ; la règle les signale à tort.
ignore = ["RUF012"]
