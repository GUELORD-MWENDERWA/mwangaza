{% load i18n %}{% get_current_language as language %}<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %}</title>
<style>
@page {
  size: {% if paper == "a5" %}A5{% else %}A4{% endif %};
  margin: {% if paper == "a5" %}10mm 10mm 12mm{% else %}14mm 14mm 16mm{% endif %};
  @bottom-right { content: "{% translate 'page' %} " counter(page) " / " counter(pages); font-size: 8pt; color: #555; font-family: "Atkinson Hyperlegible", "DejaVu Sans", Arial, sans-serif; }
}
* { box-sizing: border-box; }
body { margin: 0; color: #111; font-family: "Atkinson Hyperlegible", "DejaVu Sans", Arial, sans-serif; font-size: {% if paper == "a5" %}8pt{% else %}10pt{% endif %}; line-height: 1.35; }
@media screen { body { padding: 16px; background: #fff; } }
h1 { text-align: center; font-size: 1.6em; margin: 1.2em 0 .1em; }
.center { text-align: center; }
.small { font-size: .85em; }
.muted { color: #555; }
.row { display: flex; gap: 12px; align-items: flex-start; }
.between { justify-content: space-between; }
.grow { flex: 1; }
.logo { width: 16mm; height: 16mm; object-fit: contain; }
.logo-text { width: 16mm; height: 16mm; border: 2px solid #111; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
table { width: 100%; border-collapse: collapse; margin-top: .8em; }
th, td { border: 1px solid #999; padding: .3em .5em; text-align: left; vertical-align: top; }
th { background: #eee; font-size: .9em; }
td.num, th.num { text-align: right; white-space: nowrap; }
thead { display: table-header-group; }
tr { break-inside: avoid; }
{% block style %}{% endblock %}
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
