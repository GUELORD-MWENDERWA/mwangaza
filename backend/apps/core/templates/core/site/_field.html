{% load i18n %}{# Champ du formulaire de démonstration (WEB.1d) : kind = text, tel, email, select ou textarea. #}
<label class="f"><span>{{ label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% else %} <span class="help">({% translate "optional" %})</span>{% endif %}</span>
{% if kind == "select" %}<select class="inp{% if field.errors %} err{% endif %}" name="{{ field.html_name }}"{% if field.field.required %} required{% endif %}{% if field.errors %} aria-invalid="true" aria-describedby="{{ field.auto_id }}-err"{% endif %}><option value="">{% translate "Choose…" %}</option>{% for value, text in field.field.choices %}<option value="{{ value }}"{% if field.value == value %} selected{% endif %}>{{ text }}</option>{% endfor %}</select>
{% elif kind == "textarea" %}<textarea class="inp{% if field.errors %} err{% endif %}" name="{{ field.html_name }}" maxlength="{{ field.field.max_length }}" placeholder="{{ placeholder }}"{% if field.errors %} aria-invalid="true" aria-describedby="{{ field.auto_id }}-err"{% endif %}>{{ field.value|default:"" }}</textarea>
{% else %}<input class="inp{% if field.errors %} err{% endif %}" type="{{ kind }}" name="{{ field.html_name }}" value="{{ field.value|default:"" }}" maxlength="{{ field.field.max_length }}"{% if autocomplete %} autocomplete="{{ autocomplete }}"{% endif %}{% if kind == "tel" %} inputmode="tel"{% endif %}{% if field.field.required %} required{% endif %}{% if field.errors %} aria-invalid="true" aria-describedby="{{ field.auto_id }}-err"{% endif %}>{% endif %}
{% if field.errors %}<span class="errtxt" id="{{ field.auto_id }}-err">{{ field.errors.0 }}</span>{% endif %}</label>
