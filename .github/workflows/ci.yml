# Contrôles de chaque PR et de main, avec les mêmes commandes `make` que sur la machine.
# Une PR ne lance que les contrôles concernés par les fichiers qu'elle change
# (`.github/scripts/changes.sh`) ; `main` relance toujours tout après une fusion.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Fichiers changés
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      e2e: ${{ steps.areas.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Une PR est testée fusionnée dans `main` : ce commit et ses deux parents suffisent.
          fetch-depth: 2
      - name: Contrôles à lancer
        id: areas
        env:
          EVENT: ${{ github.event_name }}
        # `shell: bash` : une erreur du script arrête l'étape (pipefail), au lieu de tout sauter.
        shell: bash
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Premier parent = `main` : la différence est ce que la PR change. Diff impossible :
            # liste vide, donc tout est lancé.
            files=$(git -c core.quotePath=false diff --name-only HEAD^1 HEAD || true)
          else
            files=
          fi
          echo "$files"
          echo "$files" | bash .github/scripts/changes.sh | tee -a "$GITHUB_OUTPUT"

  # Chaque contrôle n'est sauté que sur un « false » explicite : sortie absente, il tourne.
  backend:
    name: Backend (ruff, pytest, OpenAPI)
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-24.04
    # Un contrôle dure environ 5 minutes : bloqué (requête sans fin…), il échoue vite au lieu de
    # tourner jusqu'à 6 heures.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mwangaza
          POSTGRES_USER: mwangaza
          POSTGRES_PASSWORD: mwangaza
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mwangaza -d mwangaza"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mwangaza
      POSTGRES_USER: mwangaza
      POSTGRES_PASSWORD: mwangaza
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Bibliothèques de WeasyPrint (PDF)
        run: sudo apt-get update -q && sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Dépendances (uv.lock à jour exigé)
        working-directory: backend
        run: uv sync --locked
      - name: Lint
        run: make lint-back
      - name: Tests
        run: make test-back
      - name: Schéma OpenAPI commité à jour
        run: |
          make api-schema
          git diff --exit-code frontend/packages/api/openapi.yaml

  frontend:
    name: Frontend (ESLint, Prettier, types, Vitest, build)
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-24.04
    # Un contrôle dure environ 5 minutes : bloqué (requête sans fin…), il échoue vite au lieu de
    # tourner jusqu'à 6 heures.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dépendances (pnpm-lock.yaml à jour exigé)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Types du client de l'API à jour (make api)
        working-directory: frontend
        run: |
          pnpm --filter @mwangaza/api generate
          git diff --exit-code packages/api/src/schema.d.ts
      - name: Lint
        run: make lint-front
      - name: Tests
        run: make test-front
      - name: Build
        run: make build

  e2e:
    name: Parcours dans le navigateur (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    # Un contrôle dure environ 5 minutes : bloqué (requête sans fin…), il échoue vite au lieu de
    # tourner jusqu'à 6 heures.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mwangaza
          POSTGRES_USER: mwangaza
          POSTGRES_PASSWORD: mwangaza
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mwangaza -d mwangaza"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mwangaza
      POSTGRES_USER: mwangaza
      POSTGRES_PASSWORD: mwangaza
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Bibliothèques de WeasyPrint (PDF)
        run: sudo apt-get update -q && sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Dépendances
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && pnpm install --frozen-lockfile)
      # Chromium (≈ 150 Mo) gardé entre deux passages tant que la version de Playwright ne change pas :
      # moins de minutes d'Actions (quota d'un dépôt privé).
      - name: Version de Playwright
        id: playwright
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium de Playwright
        working-directory: frontend
        run: |
          if [ "${{ steps.chromium.outputs.cache-hit }}" = true ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Base de données
        run: make migrate
      - name: Parcours
        run: make test-e2e
      - name: Traces des parcours ratés
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
