# Failles connues dans les dépendances de production (S.2). Séparé de `ci.yml` : une faille
# publiée demain ne doit pas bloquer une PR qui ne touche à aucune dépendance. Tourne donc sur
# `main`, chaque lundi, et sur une PR seulement si elle change un fichier de verrouillage.
name: Audit des dépendances

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - backend/uv.lock
      - backend/pyproject.toml
      - frontend/pnpm-lock.yaml
      - .github/workflows/audit.yml

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      # `uvx` lance pip-audit sans l'ajouter aux dépendances du projet. Toute faille connue
      # échoue (pip-audit ne donne pas de gravité) ; une faille sans correctif ni risque réel
      # s'écrit en `--ignore-vuln <identifiant>` ici, avec la raison en commentaire.
      - name: Failles des paquets verrouillés
        working-directory: backend
        run: uv export --locked --no-dev --no-hashes --no-emit-project | uvx pip-audit -r /dev/stdin --no-deps --disable-pip

  node:
    name: Node (pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Failles hautes ou critiques (production)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
