        name: action
        schema:
          enum:
          - auth.login
          - account.password_changed
          - account.totp_enabled
          - account.totp_changed
          - account.totp_disabled
          - account.totp_reset
          - account.recovery_codes_renewed
          - account.changed
          - account.deactivated
          - account.reactivated
          - account.password_reset
          - roles.created
          - roles.updated
          - roles.deleted
          - staff.added
          - staff.roles_changed
          - staff.deactivated
          - staff.reactivated
          - staff.account_changed
          - staff.password_reset
          - staff.totp_reset
          - school.created
          - school.updated
          - school.logo_changed
          - school.suspended
          - school.reactivated
          - organisation.year_created
          - organisation.year_updated
          - organisation.year_deleted
          - organisation.terms_changed
          - organisation.level_created
          - organisation.level_updated
          - organisation.level_deleted
          - organisation.levels_reordered
          - organisation.track_created
          - organisation.track_updated
          - organisation.track_deleted
          - organisation.class_created
          - organisation.class_updated
          - organisation.class_deleted
          - organisation.matricule_format_changed
          - students.family_created
          - students.family_updated
          - students.family_deleted
          - students.student_created
          - students.student_updated
          - students.enrolled
          - students.enrollment_updated
          - students.student_imported
          - students.family_code_printed
          - finance.fee_type_created
          - finance.fee_type_updated
          - finance.fee_type_deleted
          - finance.fee_rule_created
          - finance.fee_rule_updated
          - finance.fee_rule_deleted
          - finance.fee_rules_copied
          - finance.exchange_rate_set
          - finance.charges_rescheduled
          - finance.discount_granted
          - finance.discount_revoked
          - finance.cash_register_created
          - finance.cash_register_updated
          - finance.cash_session_opened
          - finance.payment_recorded
          - finance.payment_reprinted
          - finance.credit_created
          - finance.credit_used
          - finance.credit_voided
          - devices.registered
          - devices.revoked
          - audit.exported
          - support.started
          - support.ended
          type: string
          minLength: 1
        description: |-
          * `auth.login` - Logged in
          * `account.password_changed` - Password changed
          * `account.totp_enabled` - Two-factor authentication turned on
          * `account.totp_changed` - Two-factor authentication on a new phone
          * `account.totp_disabled` - Two-factor authentication turned off
          * `account.totp_reset` - Two-factor authentication reset by support
          * `account.recovery_codes_renewed` - New recovery codes
          * `account.changed` - Names or phone changed by support
          * `account.deactivated` - Account deactivated by support
          * `account.reactivated` - Account reactivated by support
          * `account.password_reset` - Temporary password given by support
          * `roles.created` - Role created
          * `roles.updated` - Role changed
          * `roles.deleted` - Role deleted
          * `staff.added` - Staff member added
          * `staff.roles_changed` - Staff member's roles changed
          * `staff.deactivated` - Staff member deactivated
          * `staff.reactivated` - Staff member reactivated
          * `staff.account_changed` - Staff member's names or phone changed
          * `staff.password_reset` - Temporary password given
          * `staff.totp_reset` - Two-factor authentication reset
          * `school.created` - School created
          * `school.updated` - School settings changed
          * `school.logo_changed` - School logo changed
          * `school.suspended` - School suspended
          * `school.reactivated` - School reactivated
          * `organisation.year_created` - School year created
          * `organisation.year_updated` - School year changed
          * `organisation.year_deleted` - School year deleted
          * `organisation.terms_changed` - Terms and periods changed
          * `organisation.level_created` - Level created
          * `organisation.level_updated` - Level changed
          * `organisation.level_deleted` - Level deleted
          * `organisation.levels_reordered` - Levels reordered
          * `organisation.track_created` - Track created
          * `organisation.track_updated` - Track changed
          * `organisation.track_deleted` - Track deleted
          * `organisation.class_created` - Class created
          * `organisation.class_updated` - Class changed
          * `organisation.class_deleted` - Class deleted
          * `organisation.matricule_format_changed` - Student number format changed
          * `students.family_created` - Family created
          * `students.family_updated` - Family changed
          * `students.family_deleted` - Family deleted
          * `students.student_created` - Student created
          * `students.student_updated` - Student changed
          * `students.enrolled` - Student enrolled
          * `students.enrollment_updated` - Enrollment changed
          * `students.student_imported` - Student imported from a file
          * `students.family_code_printed` - Family code printed on the registration form
          * `finance.fee_type_created` - Fee type created
          * `finance.fee_type_updated` - Fee type changed
          * `finance.fee_type_deleted` - Fee type deleted
          * `finance.fee_rule_created` - Fee rule created
          * `finance.fee_rule_updated` - Fee rule changed
          * `finance.fee_rule_deleted` - Fee rule deleted
          * `finance.fee_rules_copied` - Fee rules copied from another school year
          * `finance.exchange_rate_set` - Exchange rate set
          * `finance.charges_rescheduled` - Custom schedule set
          * `finance.discount_granted` - Discount granted
          * `finance.discount_revoked` - Discount revoked
          * `finance.cash_register_created` - Cash register created
          * `finance.cash_register_updated` - Cash register changed
          * `finance.cash_session_opened` - Cash session opened
          * `finance.payment_recorded` - Payment recorded
          * `finance.payment_reprinted` - Receipt reprinted
          * `finance.credit_created` - Student credit created
          * `finance.credit_used` - Student credit used
          * `finance.credit_voided` - Student credit voided
          * `devices.registered` - Device remembered
          * `devices.revoked` - Device disconnected
          * `audit.exported` - Audit log exported
          * `support.started` - Support session opened
          * `support.ended` - Support session closed
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
        description: Qui (`id` du compte).
      - in: query
        name: domain
        schema:
          enum:
          - account
          - audit
          - auth
          - devices
          - finance
          - organisation
          - roles
          - school
          - staff
          - students
          - support
          type: string
          minLength: 1
        description: |-
          * `account` - account
          * `audit` - audit
          * `auth` - auth
          * `devices` - devices
          * `finance` - finance
          * `organisation` - organisation
          * `roles` - roles
          * `school` - school
          * `staff` - staff
          * `students` - students
          * `support` - support
      - in: query
        name: entity
        schema:
          type: string
          format: uuid
        description: Historique d'un objet (`entity_id`).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Dans le nom de l'objet.
      - in: query
        name: since
        schema:
          type: string
          format: date
        description: À partir de ce jour.
      - in: query
        name: until
        schema:
          type: string
          format: date
        description: Jusqu'à ce jour.
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/audit/{id}/:
