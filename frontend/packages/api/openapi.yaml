          items:
            type: string
            format: uuid
          readOnly: true
        is_active:
          type: boolean
          title: Actif
        totp:
          allOf:
          - $ref: '#/components/schemas/TotpEnum'
          description: Double authentification (colonne de M3).
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Dernière connexion à cette école.
        account_managed_here:
          type: boolean
          readOnly: true
          description: 'L''école peut changer les noms, le téléphone, le mot de passe
            et la double authentification : le compte ne sert dans aucune autre école.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        existing_account:
          type: boolean
          description: 'Le numéro avait déjà un compte : ajouté à l''école sans nouveau
            mot de passe.'
        temporary_password:
          type: string
          nullable: true
          description: 'Nouveau compte seulement : affiché une seule fois, à changer
            à la connexion.'
      required:
      - account_managed_here
      - created_at
      - existing_account
      - id
      - last_login_at
      - roles
      - temporary_password
      - totp
      - user
    StaffUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          description: Identifies the person on the whole platform, e.g. +243971234567.
          maxLength: 16
        last_name:
          type: string
          title: Nom
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        first_name:
          type: string
          title: Prénom
          maxLength: 100
      required:
      - id
      - last_name
      - phone
    StatusEnum:
      enum:
      - trial
      - active
      - suspended
      type: string
      description: |-
        * `trial` - Trial
        * `active` - Active
        * `suspended` - Suspended
    StepEnum:
      enum:
      - password
      - totp
      - new_password
      - totp_setup
      - done
      type: string
      description: |-
        * `password` - Phone number and password
        * `totp` - Two-factor authentication code
        * `new_password` - Replace the temporary password
        * `totp_setup` - Turn on two-factor authentication
        * `done` - Logged in
    TemporaryPassword:
      type: object
      properties:
        temporary_password:
          type: string
          description: Affiché une seule fois, à changer à la prochaine connexion.
      required:
      - temporary_password
    TotpActivated:
      type: object
      properties:
        step:
          allOf:
          - $ref: '#/components/schemas/StepEnum'
          description: |-
            Étape suivante de la connexion ; `done` : connecté.

            * `password` - Phone number and password
            * `totp` - Two-factor authentication code
            * `new_password` - Replace the temporary password
            * `totp_setup` - Turn on two-factor authentication
            * `done` - Logged in
        recovery_codes:
          type: array
          items:
            type: string
          description: 'Affichés une seule fois : à imprimer.'
      required:
      - recovery_codes
      - step
    TotpEnum:
      enum:
      - enabled
      - to_enable
      - not_required
      type: string
    TotpKey:
      type: object
      properties:
        secret:
          type: string
          description: Clé à taper si on ne peut pas scanner le QR code.
        otpauth_uri:
          type: string
          description: Contenu du QR code à scanner.
      required:
      - otpauth_uri
      - secret
    TotpSetup:
      type: object
      properties:
        code:
          type: string
          description: 'Double authentification déjà activée (changer de téléphone)
            : code actuel ou code de secours.'
          maxLength: 20
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
