openapi: 3.0.3
info:
  title: Mwangaza API
  version: 0.1.0
  description: API de la plateforme de gestion scolaire Mwangaza.
paths:
  /api/academic-years/:
    get:
      operationId: academic_years_list
      description: Années scolaires de l'école, la plus récente d'abord, avec leur
        découpage (C1).
      tags:
      - organisation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYear'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: academic_years_create
      description: |-
        Nouvelle année depuis un modèle de découpage, avec en option les classes d'une autre
        année, et ses barèmes (`copy_fees`, droit `finance.configure_fees` en plus).
      tags:
      - organisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/academic-years/{id}/:
    get:
      operationId: academic_years_retrieve
      description: Années scolaires de l'école, la plus récente d'abord, avec leur
        découpage (C1).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: academic_years_partial_update
      description: Années scolaires de l'école, la plus récente d'abord, avec leur
        découpage (C1).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: academic_years_destroy
      description: Années scolaires de l'école, la plus récente d'abord, avec leur
        découpage (C1).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/academic-years/{id}/make-current/:
    post:
      operationId: academic_years_make_current_create
      description: 'Année en cours : celle des inscriptions et des écrans par défaut.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/academic-years/{id}/terms/:
    put:
      operationId: academic_years_terms_update
      description: 'Tout le découpage de l''année : noms, dates, éléments ajoutés
        ou retirés.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TermsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TermsUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/announcements/:
    get:
      operationId: announcements_list
      description: |-
        Annonces de l'école aux familles (H4) ou à son personnel (5.7), les plus récentes d'abord :
        publiées tout de suite, jamais modifiées, seulement archivées (retirées du portail ou de la
        Gestion).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - announcements
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: announcements_create
      description: |-
        Annonces de l'école aux familles (H4) ou à son personnel (5.7), les plus récentes d'abord :
        publiées tout de suite, jamais modifiées, seulement archivées (retirées du portail ou de la
        Gestion).
      tags:
      - announcements
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/announcements/{id}/archive/:
    post:
      operationId: announcements_archive_create
      description: Retire l'annonce du portail des familles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - announcements
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/announcements/{id}/attachment/:
    get:
      operationId: announcements_attachment_retrieve
      description: PDF joint à l'annonce, jamais public.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - announcements
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: PDF.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/announcements/{id}/circular/:
    get:
      operationId: announcements_circular_retrieve
      description: |-
        L'annonce en lettre circulaire à l'en-tête de l'école (5.7), à imprimer pour les
        familles qui n'ont pas le portail.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      - in: query
        name: orientation
        schema:
          enum:
          - portrait
          - landscape
          type: string
          minLength: 1
        description: |-
          Absent : le sens habituel du document.

          * `portrait` - portrait
          * `landscape` - landscape
      - in: query
        name: output
        schema:
          enum:
          - pdf
          - html
          type: string
          default: pdf
          minLength: 1
        description: |-
          `html` : aperçu ; `pdf` : à imprimer.

          * `pdf` - pdf
          * `html` - html
      - in: query
        name: paper
        schema:
          enum:
          - a4
          - a5
          type: string
          default: a4
          minLength: 1
        description: |-
          * `a4` - a4
          * `a5` - a5
      - in: query
        name: per_sheet
        schema:
          type: integer
          maximum: 3
          minimum: 1
          default: 1
        description: Exemplaires par feuille.
      tags:
      - announcements
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
          description: Document PDF (`output=pdf`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/announcements/recipients/:
    get:
      operationId: announcements_recipients_retrieve
      description: |-
        Nombre de familles, ou de personnes de l'école, qu'une annonce toucherait (« Publier
        pour 156 familles »).
      parameters:
      - in: query
        name: audience
        schema:
          enum:
          - all_families
          - class_groups
          - staff
          type: string
          minLength: 1
        description: |-
          * `all_families` - All families
          * `class_groups` - Some classes
          * `staff` - Staff
        required: true
      - in: query
        name: class_groups
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Classes de l'année en cours (pour `class_groups`).
      tags:
      - announcements
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipients'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/audit/:
    get:
      operationId: audit_list
      description: Journal d'audit de l'école (M6), le plus récent d'abord ; en lecture
        seule.
      parameters:
      - in: query
        name: action
        schema:
          enum:
          - auth.login
          - account.password_changed
          - account.totp_enabled
          - account.totp_changed
          - account.totp_disabled
          - account.totp_reset
          - account.recovery_codes_renewed
          - account.changed
          - account.deactivated
          - account.reactivated
          - account.password_reset
          - roles.created
          - roles.updated
          - roles.deleted
          - staff.added
          - staff.roles_changed
          - staff.deactivated
          - staff.reactivated
          - staff.account_changed
          - staff.signature_changed
          - staff.password_reset
          - staff.totp_reset
          - school.created
          - school.updated
          - school.logo_changed
          - school.signature_changed
          - school.suspended
          - school.reactivated
          - school.stopped
          - organisation.year_created
          - organisation.year_updated
          - organisation.year_deleted
          - organisation.terms_changed
          - organisation.level_created
          - organisation.level_updated
          - organisation.level_deleted
          - organisation.levels_reordered
          - organisation.track_created
          - organisation.track_updated
          - organisation.track_deleted
          - organisation.class_created
          - organisation.class_updated
          - organisation.class_deleted
          - organisation.matricule_format_changed
          - courses.changed
          - grades.changed
          - grades.submitted
          - grades.validated
          - grades.reopened
          - grades.deadline_set
          - grades.report_card_printed
          - grades.sheet_printed
          - discipline.rule_changed
          - discipline.scale_changed
          - discipline.incident_recorded
          - discipline.incident_cancelled
          - discipline.grade_overridden
          - students.family_created
          - students.family_updated
          - students.family_deleted
          - students.student_created
          - students.student_updated
          - students.enrolled
          - students.enrollment_updated
          - students.student_imported
          - students.import_cancelled
          - students.student_removed
          - students.family_code_printed
          - students.family_code_renewed
          - students.family_invitation_printed
          - students.family_invitation_shared
          - students.portal_suspended
          - students.portal_restored
          - students.contact_change_applied
          - students.contact_change_dismissed
          - portal.activated
          - portal.password_reset
          - finance.fee_type_created
          - finance.fee_type_updated
          - finance.fee_type_deleted
          - finance.fee_rule_created
          - finance.fee_rule_updated
          - finance.fee_rule_deleted
          - finance.fee_rules_copied
          - finance.exchange_rate_set
          - finance.charges_rescheduled
          - finance.discount_granted
          - finance.discount_revoked
          - finance.cash_register_created
          - finance.cash_register_updated
          - finance.cash_session_opened
          - finance.cash_session_closed
          - finance.payment_recorded
          - finance.prior_payment_recorded
          - finance.payment_reprinted
          - finance.cancellation_requested
          - finance.payment_cancelled
          - finance.cancellation_rejected
          - finance.cancellation_reprinted
          - finance.credit_created
          - finance.credit_used
          - finance.credit_voided
          - finance.unpaid_exported
          - finance.receipt_register_exported
          - finance.statement_printed
          - announcements.published
          - announcements.archived
          - announcements.summons_issued
          - announcements.summons_cancelled
          - devices.registered
          - devices.revoked
          - audit.exported
          - support.started
          - support.ended
          type: string
          minLength: 1
        description: |-
          * `auth.login` - Logged in
          * `account.password_changed` - Password changed
          * `account.totp_enabled` - Two-factor authentication turned on
          * `account.totp_changed` - Two-factor authentication on a new phone
          * `account.totp_disabled` - Two-factor authentication turned off
          * `account.totp_reset` - Two-factor authentication reset by support
          * `account.recovery_codes_renewed` - New recovery codes
          * `account.changed` - Names or phone changed by support
          * `account.deactivated` - Account deactivated by support
          * `account.reactivated` - Account reactivated by support
          * `account.password_reset` - Temporary password given by support
          * `roles.created` - Role created
          * `roles.updated` - Role changed
          * `roles.deleted` - Role deleted
          * `staff.added` - Staff member added
          * `staff.roles_changed` - Staff member's roles changed
          * `staff.deactivated` - Staff member deactivated
          * `staff.reactivated` - Staff member reactivated
          * `staff.account_changed` - Staff member's names or phone changed
          * `staff.signature_changed` - Staff member's signature changed
          * `staff.password_reset` - Temporary password given
          * `staff.totp_reset` - Two-factor authentication reset
          * `school.created` - School created
          * `school.updated` - School settings changed
          * `school.logo_changed` - School logo changed
          * `school.signature_changed` - School stamp or signature of the head changed
          * `school.suspended` - School suspended
          * `school.reactivated` - School reactivated
          * `school.stopped` - School stopped
          * `organisation.year_created` - School year created
          * `organisation.year_updated` - School year changed
          * `organisation.year_deleted` - School year deleted
          * `organisation.terms_changed` - Terms and periods changed
          * `organisation.level_created` - Level created
          * `organisation.level_updated` - Level changed
          * `organisation.level_deleted` - Level deleted
          * `organisation.levels_reordered` - Levels reordered
          * `organisation.track_created` - Track created
          * `organisation.track_updated` - Track changed
          * `organisation.track_deleted` - Track deleted
          * `organisation.class_created` - Class created
          * `organisation.class_updated` - Class changed
          * `organisation.class_deleted` - Class deleted
          * `organisation.matricule_format_changed` - Student number format changed
          * `courses.changed` - Courses of a class changed
          * `grades.changed` - Grades changed
          * `grades.submitted` - Grades sent for validation
          * `grades.validated` - Grades validated
          * `grades.reopened` - Grades reopened
          * `grades.deadline_set` - Grade entry deadline set
          * `grades.report_card_printed` - Report card printed
          * `grades.sheet_printed` - Grade sheet printed
          * `discipline.rule_changed` - Offence list changed
          * `discipline.scale_changed` - Conduct scale changed
          * `discipline.incident_recorded` - Offence recorded
          * `discipline.incident_cancelled` - Offence cancelled
          * `discipline.grade_overridden` - Conduct grade corrected
          * `students.family_created` - Family created
          * `students.family_updated` - Family changed
          * `students.family_deleted` - Family deleted
          * `students.student_created` - Student created
          * `students.student_updated` - Student changed
          * `students.enrolled` - Student enrolled
          * `students.enrollment_updated` - Enrollment changed
          * `students.student_imported` - Student imported from a file
          * `students.import_cancelled` - Student import cancelled
          * `students.student_removed` - Student removed (import cancelled)
          * `students.family_code_printed` - Family code printed on the registration form
          * `students.family_code_renewed` - New family code
          * `students.family_invitation_printed` - Portal invitation letter printed (family code)
          * `students.family_invitation_shared` - Portal invitation message opened (family code)
          * `students.portal_suspended` - Parent portal access suspended
          * `students.portal_restored` - Parent portal access restored
          * `students.contact_change_applied` - Contact details sent by the parent applied
          * `students.contact_change_dismissed` - Contact details sent by the parent not applied
          * `portal.activated` - Parent portal activated
          * `portal.password_reset` - Parent chose a new password
          * `finance.fee_type_created` - Fee type created
          * `finance.fee_type_updated` - Fee type changed
          * `finance.fee_type_deleted` - Fee type deleted
          * `finance.fee_rule_created` - Fee rule created
          * `finance.fee_rule_updated` - Fee rule changed
          * `finance.fee_rule_deleted` - Fee rule deleted
          * `finance.fee_rules_copied` - Fee rules copied from another school year
          * `finance.exchange_rate_set` - Exchange rate set
          * `finance.charges_rescheduled` - Custom schedule set
          * `finance.discount_granted` - Discount granted
          * `finance.discount_revoked` - Discount revoked
          * `finance.cash_register_created` - Cash register created
          * `finance.cash_register_updated` - Cash register changed
          * `finance.cash_session_opened` - Cash session opened
          * `finance.cash_session_closed` - Cash session closed
          * `finance.payment_recorded` - Payment recorded
          * `finance.prior_payment_recorded` - Earlier payment recorded (not at the cash desk)
          * `finance.payment_reprinted` - Receipt reprinted
          * `finance.cancellation_requested` - Payment cancellation requested
          * `finance.payment_cancelled` - Payment cancelled
          * `finance.cancellation_rejected` - Payment cancellation refused
          * `finance.cancellation_reprinted` - Cancellation receipt reprinted
          * `finance.credit_created` - Student credit created
          * `finance.credit_used` - Student credit used
          * `finance.credit_voided` - Student credit voided
          * `finance.unpaid_exported` - Unpaid fees exported
          * `finance.receipt_register_exported` - Receipt register exported
          * `finance.statement_printed` - Financial statement printed
          * `announcements.published` - Announcement published
          * `announcements.archived` - Announcement archived
          * `announcements.summons_issued` - Parents summoned
          * `announcements.summons_cancelled` - Summons cancelled
          * `devices.registered` - Device remembered
          * `devices.revoked` - Device disconnected
          * `audit.exported` - Audit log exported
          * `support.started` - Support session opened
          * `support.ended` - Support session closed
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
        description: Qui (`id` du compte).
      - in: query
        name: domain
        schema:
          enum:
          - account
          - announcements
          - audit
          - auth
          - courses
          - devices
          - discipline
          - finance
          - grades
          - organisation
          - portal
          - roles
