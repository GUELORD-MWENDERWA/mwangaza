    PermissionsEnum:
      enum:
      - school.configure
      - classes.manage
      - courses.configure
      - grades.enter
      - grades.enter_any
      - grades.validate
      - discipline.configure
      - discipline.record
      - discipline.override
      - roles.manage
      - students.view
      - students.edit
      - students.import
      - finance.configure_fees
      - finance.set_exchange_rate
      - finance.grant_discount
      - finance.collect_payment
      - finance.request_cancellation
      - finance.approve_cancellation
      - finance.close_register
      - finance.view_reports
      - finance.import_prior_payments
      - announcements.publish
      - audit.view
      type: string
      description: |-
        * `school.configure` - Configure the school (name, logo, colour, currencies, receipts)
        * `classes.manage` - Manage years, terms, levels, tracks, classes and student numbers
        * `courses.configure` - Configure courses, maxima and teachers of each class
        * `grades.enter` - Enter the grades of one's courses and of one's homeroom class
        * `grades.enter_any` - Enter the grades of every class
        * `grades.validate` - Validate the grades sent by teachers and set the entry deadlines
        * `discipline.configure` - Configure the offences, their points and the conduct scale
        * `discipline.record` - Record an offence of a student
        * `discipline.override` - Correct the conduct grade of a student
        * `roles.manage` - Manage staff accounts and roles
        * `students.view` - View students
        * `students.edit` - Edit students
        * `students.import` - Import students from Excel
        * `finance.configure_fees` - Configure fees
        * `finance.set_exchange_rate` - Set the exchange rate
        * `finance.grant_discount` - Grant discounts
        * `finance.collect_payment` - Collect payments
        * `finance.request_cancellation` - Request a payment cancellation
        * `finance.approve_cancellation` - Approve a payment cancellation
        * `finance.close_register` - Close a cash register
        * `finance.view_reports` - View financial reports
        * `finance.import_prior_payments` - Record what students paid before the school started here
        * `announcements.publish` - Publish announcements
        * `audit.view` - View the audit log
