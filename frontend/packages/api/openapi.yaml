          type: string
          format: date
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/TermInputLeafRequest'
      required:
      - kind
    TermKindEnum:
      enum:
      - semester
      - trimester
      - period
      - exam
      type: string
      description: |-
        * `semester` - Semester
        * `trimester` - Term (trimester)
        * `period` - Period
        * `exam` - Exams
    TermLeaf:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TermKindEnum'
        name:
          type: string
          description: 'Vide : l''interface affiche le nom traduit d''après le genre
            et la place (« 1re période », « Examens du 1er semestre »).'
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
      required:
      - id
      - kind
      - name
      - starts_on
      - ends_on
    TermsUpdateRequest:
      type: object
      description: 'Tout le découpage : ce qui n''y est plus est retiré.'
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/TermInputRequest'
      required:
      - terms
    TotpActivated:
      type: object
      properties:
        step:
          allOf:
          - $ref: '#/components/schemas/StepEnum'
          description: |-
            Étape suivante de la connexion ; `done` : connecté.

            * `password` - Phone number and password
            * `totp` - Two-factor authentication code
            * `new_password` - Replace the temporary password
            * `totp_setup` - Turn on two-factor authentication
            * `done` - Logged in
        recovery_codes:
          type: array
          items:
            type: string
          description: 'Affichés une seule fois : à imprimer.'
      required:
      - step
      - recovery_codes
    TotpEnum:
      enum:
      - enabled
      - to_enable
      - not_required
      type: string
    TotpKey:
      type: object
      properties:
        secret:
          type: string
          description: Clé à taper si on ne peut pas scanner le QR code.
        otpauth_uri:
          type: string
          description: Contenu du QR code à scanner.
      required:
      - secret
      - otpauth_uri
    TotpSetupRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: 'Double authentification déjà activée (changer de téléphone)
            : code actuel ou code de secours.'
          maxLength: 20
    Track:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        code:
          type: string
          description: Majuscules et chiffres (matricule `{OPT}`).
          maxLength: 10
      required:
      - id
      - name
      - code
    TrackRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        code:
          type: string
          minLength: 1
          description: Majuscules et chiffres (matricule `{OPT}`).
          maxLength: 10
      required:
      - code
      - name
    YearStatusEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
