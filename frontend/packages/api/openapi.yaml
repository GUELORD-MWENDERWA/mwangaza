  /api/payments/:
    get:
      operationId: payments_list
      description: |-
        Paiements (F1-F2), les plus récents d'abord ; ni modifiables ni effaçables. Sans
        `finance.view_reports`, seulement ceux des sessions du caissier. Création : 201, ou 200 si ce
        paiement (même `id`) était déjà enregistré. Création, lecture et réimpression rendent le
        reçu (F3).
      parameters:
      - in: query
        name: enrollment
        schema:
          type: string
          format: uuid
        description: Paiements d'une inscription.
      - in: query
        name: origin
        schema:
          enum:
          - cash
          - prior
          type: string
          minLength: 1
        description: |-
          `prior` : seulement les reprises en cours d'année (E6).

          * `cash` - Collected at the cash desk
          * `prior` - Paid before the school started here
      - name: page
        required: false
