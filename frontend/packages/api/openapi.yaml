  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Donne le cookie CSRF à l'application avant la connexion (en-tête
        `X-CSRFToken`).
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    get:
      operationId: auth_login_retrieve
      description: 'Étape 1 : numéro et mot de passe.'
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStep'
          description: ''
    post:
      operationId: auth_login_create
      description: 'Étape 1 : numéro et mot de passe.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
