        Rôle de l'école. `name` vide pour un rôle système : l'interface affiche le nom traduit de
        son `code`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          readOnly: true
          description: |-
            Code du rôle système ; vide pour un rôle créé par l'école.

            * `head` - Head of school
            * `study_director` - Director of studies
            * `discipline_master` - Discipline master
            * `accountant` - Accountant
            * `cashier` - Cashier
            * `secretary` - Secretary
            * `promoter` - Promoter
            * `teacher` - Teacher
            * `parent` - Parent
          oneOf:
          - $ref: '#/components/schemas/CodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        name:
          type: string
          title: Nom
          maxLength: 80
        is_system:
          type: boolean
          readOnly: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionsEnum'
        member_count:
          type: integer
          readOnly: true
          description: Comptes actifs qui ont ce rôle dans l'école.
      required:
      - code
      - id
      - is_system
      - member_count
    RoleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          readOnly: true
          description: |-
            Code du rôle système ; vide pour un rôle créé par l'école.

            * `head` - Head of school
            * `study_director` - Director of studies
            * `discipline_master` - Discipline master
            * `accountant` - Accountant
            * `cashier` - Cashier
            * `secretary` - Secretary
            * `promoter` - Promoter
            * `teacher` - Teacher
            * `parent` - Parent
          oneOf:
          - $ref: '#/components/schemas/CodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        name:
          type: string
          title: Nom
          maxLength: 80
      required:
      - code
      - id
    Staff:
      type: object
      description: |-
        Une personne dans l'école (son appartenance) ; `id` est celui de l'appartenance. Rien sur
        ses autres écoles.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/StaffUser'
          readOnly: true
        roles:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        is_active:
          type: boolean
          title: Actif
        totp:
          allOf:
          - $ref: '#/components/schemas/TotpEnum'
          description: Double authentification (colonne de M3).
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Dernière connexion à cette école.
        account_managed_here:
          type: boolean
          readOnly: true
          description: 'L''école peut changer les noms, le téléphone, le mot de passe
            et la double authentification : le compte ne sert dans aucune autre école.'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_managed_here
      - created_at
      - id
      - last_login_at
      - roles
      - totp
      - user
    StaffCreate:
      type: object
      description: 'Nouveau numéro : `last_name` obligatoire. Numéro déjà connu :
        noms ignorés.'
      properties:
        phone:
          type: string
          description: Ex. 0971234567 ou +243971234567.
        last_name:
          type: string
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        first_name:
          type: string
          maxLength: 100
        roles:
          type: array
          items:
            type: string
