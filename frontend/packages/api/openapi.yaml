openapi: 3.0.3
info:
  title: Mwangaza API
  version: 0.1.0
  description: API de la plateforme de gestion scolaire Mwangaza.
paths:
  /api/academic-years/:
    get:
      operationId: academic_years_list
      description: Années scolaires de l'école, la plus récente d'abord, avec leur
        découpage (C1).
      tags:
      - organisation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYear'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: academic_years_create
      description: |-
        Nouvelle année depuis un modèle de découpage, avec en option les classes d'une autre
        année, et ses barèmes (`copy_fees`, droit `finance.configure_fees` en plus).
      tags:
      - organisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/academic-years/{id}/:
    get:
      operationId: academic_years_retrieve
      description: Années scolaires de l'école, la plus récente d'abord, avec leur
        découpage (C1).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: academic_years_partial_update
      description: Années scolaires de l'école, la plus récente d'abord, avec leur
        découpage (C1).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: academic_years_destroy
      description: Années scolaires de l'école, la plus récente d'abord, avec leur
        découpage (C1).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/academic-years/{id}/make-current/:
    post:
      operationId: academic_years_make_current_create
      description: 'Année en cours : celle des inscriptions et des écrans par défaut.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/academic-years/{id}/terms/:
    put:
      operationId: academic_years_terms_update
      description: 'Tout le découpage de l''année : noms, dates, éléments ajoutés
        ou retirés.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this school year.
        required: true
      tags:
      - organisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TermsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TermsUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/audit/:
    get:
      operationId: audit_list
      description: Journal d'audit de l'école (M6), le plus récent d'abord ; en lecture
        seule.
