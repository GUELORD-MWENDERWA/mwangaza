  /api/students/:
    get:
      operationId: students_list
      description: |-
        Avec un droit de lecture des frais, le solde de l'inscription de chaque élève de la
        page (`finance`) : trois requêtes de plus, quelle que soit la taille de la page.
      parameters:
      - in: query
        name: academic_year
        schema:
          type: string
          format: uuid
        description: Année de l'inscription affichée (par défaut l'année en cours).
      - in: query
        name: class_group
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: payment
        schema:
          enum:
          - up_to_date
          - partial
          - overdue
          type: string
          minLength: 1
        description: |-
          Situation des paiements de l'année (droit de lecture des frais) : à jour, partielle (en retard, mais des paiements) ou en retard (rien payé).

          * `up_to_date` - up_to_date
          * `partial` - partial
          * `overdue` - overdue
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Noms, matricule ou code famille.
      - in: query
        name: status
        schema:
          enum:
          - active
          - left
          - not_enrolled
          type: string
          minLength: 1
        description: |-
          Cette année : inscrit et présent, inscrit puis parti (transfert, abandon, exclusion, fin d'études) ou pas inscrit. Absent : tous.

          * `active` - active
          * `left` - left
          * `not_enrolled` - not_enrolled
      - in: query
        name: track
        schema:
          type: string
          format: uuid
        description: Option de la classe de l'année.
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentListList'
          description: ''
    post:
      operationId: students_create
      description: |-
        Élève avec une famille existante (`family`) ou nouvelle (`guardians`). Même nom et
        même date de naissance qu'un autre élève : 409 `possible_duplicate` avec `duplicates` (id,
        noms, matricule : lien vers leur fiche), à renvoyer avec `allow_duplicate` après
        confirmation. Même `id` renvoyé : 200 avec l'élève déjà créé.
      tags:
      - students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
