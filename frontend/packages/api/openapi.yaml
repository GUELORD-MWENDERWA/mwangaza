  /api/enrollments/{id}/form/:
    get:
      operationId: enrollments_form_retrieve
      description: |-
        Fiche d'inscription (D5, M11) : aperçu HTML ou PDF, A4 ou A5, avec ou sans code
        famille.
      parameters:
      - in: query
        name: family_code
        schema:
          type: boolean
          default: false
        description: 'Imprimer le code famille (pour le tuteur principal) ; chaque
          PDF qui l''imprime est noté dans le journal d''audit. Décoché : fiche remise
          à un tiers.'
      - in: query
        name: fees
        schema:
          type: boolean
          default: false
        description: 'Frais de l''année de l''élève, après réductions, par devise
          : avec un droit de lecture des frais (comme `/api/student-charges/`), sinon
          403.'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this enrollment.
        required: true
      - in: query
        name: output
        schema:
          enum:
          - pdf
          - html
          type: string
          default: pdf
          minLength: 1
        description: |-
          `html` : aperçu dans la page, code famille masqué ; `pdf` : à imprimer.

          * `pdf` - pdf
          * `html` - html
      - in: query
        name: paper
        schema:
          enum:
          - a4
          - a5
          type: string
          default: a4
          minLength: 1
        description: |-
          * `a4` - a4
          * `a5` - a5
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
          description: Document PDF (`output=pdf`).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
