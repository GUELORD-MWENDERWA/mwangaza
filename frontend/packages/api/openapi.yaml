components:
  schemas:
    ActionEnum:
      enum:
      - auth.login
      - account.password_changed
      - account.totp_enabled
      - account.totp_changed
      - account.totp_disabled
      - account.totp_reset
      - account.recovery_codes_renewed
      - roles.created
      - roles.updated
      - roles.deleted
      - staff.added
      - staff.roles_changed
      - staff.deactivated
      - staff.reactivated
      - staff.account_changed
      - staff.password_reset
      - staff.totp_reset
      type: string
      description: |-
        * `auth.login` - Logged in
        * `account.password_changed` - Password changed
        * `account.totp_enabled` - Two-factor authentication turned on
        * `account.totp_changed` - Two-factor authentication on a new phone
        * `account.totp_disabled` - Two-factor authentication turned off
        * `account.totp_reset` - Two-factor authentication reset by support
        * `account.recovery_codes_renewed` - New recovery codes
        * `roles.created` - Role created
        * `roles.updated` - Role changed
        * `roles.deleted` - Role deleted
        * `staff.added` - Staff member added
        * `staff.roles_changed` - Staff member's roles changed
        * `staff.deactivated` - Staff member deactivated
        * `staff.reactivated` - Staff member reactivated
        * `staff.account_changed` - Staff member's names or phone changed
        * `staff.password_reset` - Temporary password given
        * `staff.totp_reset` - Two-factor authentication reset
    AuditActor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        last_name:
          type: string
          title: Nom
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        first_name:
          type: string
          title: Prénom
          maxLength: 100
      required:
      - id
      - last_name
    AuditLog:
      type: object
      description: 'Une entrée du journal (M6). `before` / `after` : seulement les
        champs changés.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        domain:
          allOf:
          - $ref: '#/components/schemas/DomainEnum'
          description: Domaine de l'action (filtre de M6).
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          nullable: true
          readOnly: true
          description: Qui ; vide pour le support Mwangaza (`by_support`) ou le système.
        by_support:
          type: boolean
          readOnly: true
          description: 'Action du support Mwangaza : l''interface affiche « Support
            Mwangaza ».'
        entity_type:
          type: string
          readOnly: true
          title: Object type
        entity_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          title: Object
        entity_label:
          type: string
          readOnly: true
          description: 'Nom de l''objet au moment de l''action. Vide pour un rôle
            système sans nom propre : l''interface affiche le nom traduit de son code
            (rôle `entity_id`).'
        before:
          readOnly: true
          nullable: true
        after:
          readOnly: true
          nullable: true
        ip:
          type: string
          readOnly: true
          nullable: true
          title: Adresse IP
        user_agent:
          type: string
          readOnly: true
          title: Browser
      required:
      - action
      - actor
      - after
      - before
      - by_support
      - created_at
      - domain
      - entity_id
      - entity_label
      - entity_type
      - id
      - ip
      - user_agent
    BlankEnum:
      enum:
      - ''
    Code:
      type: object
      properties:
        code:
          type: string
          description: Code à 6 chiffres de l'application, ou code de secours (ex.
            7KQ4-M2XP).
          maxLength: 20
      required:
      - code
    CodeEnum:
      enum:
      - head
      - study_director
      - discipline_master
      - accountant
      - cashier
      - secretary
      - promoter
      - teacher
      - parent
      type: string
      description: |-
        * `head` - Head of school
        * `study_director` - Director of studies
        * `discipline_master` - Discipline master
        * `accountant` - Accountant
        * `cashier` - Cashier
        * `secretary` - Secretary
        * `promoter` - Promoter
        * `teacher` - Teacher
        * `parent` - Parent
    CurrentSchool:
      type: object
      description: Informations publiques de l'école (écran de connexion) ; logo et
        couleur en 1.5.
      properties:
        code:
          type: string
          description: 'Subdomain of the school: {code}.mwangaza.school'
          pattern: ^[a-z0-9][a-z0-9-]{0,28}[a-z0-9]$
          maxLength: 30
        name:
          type: string
          title: Nom
          maxLength: 200
      required:
      - code
      - name
    CurrentSchoolAccess:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionsEnum'
      required:
      - code
      - name
      - permissions
      - roles
    DomainEnum:
      enum:
      - account
      - auth
      - roles
      - staff
      type: string
    Error:
      type: object
      properties:
        code:
          type: string
          description: Code stable, traduit par l'interface.
        detail:
          type: string
      required:
      - code
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LanguageEnum:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - Français
        * `en` - English
    Login:
      type: object
      properties:
        phone:
          type: string
          description: Ex. 0971234567 ou +243971234567.
          maxLength: 64
        password:
          type: string
          maxLength: 128
      required:
      - password
      - phone
    LoginCode:
      type: object
      properties:
        code:
          type: string
          description: Code à 6 chiffres de l'application, ou code de secours (ex.
            7KQ4-M2XP).
          maxLength: 20
        trust_device:
          type: boolean
          default: false
          description: Ne plus demander le code sur cet appareil pendant 7 jours.
      required:
      - code
    LoginStep:
      type: object
      properties:
        step:
          allOf:
          - $ref: '#/components/schemas/StepEnum'
          description: |-
            Étape suivante de la connexion ; `done` : connecté.

            * `password` - Phone number and password
            * `totp` - Two-factor authentication code
            * `new_password` - Replace the temporary password
            * `totp_setup` - Turn on two-factor authentication
            * `done` - Logged in
      required:
      - step
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        first_name:
          type: string
        language:
          $ref: '#/components/schemas/LanguageEnum'
        totp_enabled:
          type: boolean
        totp_enabled_at:
          type: string
          format: date-time
          nullable: true
        totp_required:
          type: boolean
          description: 'Un rôle du compte l''exige : impossible de la désactiver.'
        recovery_codes_left:
          type: integer
          description: Codes de secours pas encore utilisés (alerte à 2 ou moins,
            M4).
        schools:
          type: array
          items:
            $ref: '#/components/schemas/MySchool'
          description: Écoles où le compte a une appartenance active (choix de l'école).
        school:
          allOf:
          - $ref: '#/components/schemas/CurrentSchoolAccess'
          nullable: true
          description: Rôles et permissions dans l'école de l'adresse ; null sans
            accès à cette école.
      required:
      - first_name
      - id
      - language
      - last_name
      - middle_name
      - phone
      - recovery_codes_left
      - school
      - schools
      - totp_enabled
      - totp_enabled_at
      - totp_required
    MySchool:
      type: object
      properties:
        code:
          type: string
          description: 'Subdomain of the school: {code}.mwangaza.school'
          pattern: ^[a-z0-9][a-z0-9-]{0,28}[a-z0-9]$
          maxLength: 30
        name:
          type: string
          title: Nom
          maxLength: 200
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - code
      - name
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    PaginatedRoleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PaginatedStaffList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
    Password:
      type: object
      description: |-
        Connexion en cours avec un mot de passe provisoire : `new_password` seul. Compte connecté :
        `current_password` aussi.
      properties:
        current_password:
          type: string
          maxLength: 128
        new_password:
          type: string
          maxLength: 128
      required:
      - new_password
    PatchedMeUpdate:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/LanguageEnum'
    PatchedRole:
      type: object
      description: |-
        Rôle de l'école. `name` vide pour un rôle système : l'interface affiche le nom traduit de
        son `code`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          readOnly: true
          description: |-
            Code du rôle système ; vide pour un rôle créé par l'école.

            * `head` - Head of school
            * `study_director` - Director of studies
            * `discipline_master` - Discipline master
            * `accountant` - Accountant
            * `cashier` - Cashier
            * `secretary` - Secretary
            * `promoter` - Promoter
            * `teacher` - Teacher
            * `parent` - Parent
          oneOf:
          - $ref: '#/components/schemas/CodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        name:
          type: string
          title: Nom
          maxLength: 80
        is_system:
          type: boolean
          readOnly: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionsEnum'
        member_count:
          type: integer
          readOnly: true
          description: Comptes actifs qui ont ce rôle dans l'école.
    PatchedStaffUpdate:
      type: object
      description: Rôles et état dans l'école ; noms et téléphone seulement si `account_managed_here`.
      properties:
        roles:
          type: array
          items:
            type: string
            format: uuid
        is_active:
          type: boolean
        phone:
          type: string
        last_name:
          type: string
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        first_name:
          type: string
          maxLength: 100
    PermissionsEnum:
      enum:
      - school.configure
      - classes.manage
      - roles.manage
      - students.view
      - students.edit
      - students.import
      - finance.configure_fees
      - finance.set_exchange_rate
      - finance.grant_discount
      - finance.collect_payment
      - finance.request_cancellation
      - finance.approve_cancellation
      - finance.close_register
      - finance.view_reports
      - announcements.publish
      - audit.view
      type: string
      description: |-
        * `school.configure` - Configure the school (name, logo, colour, currencies, receipts)
        * `classes.manage` - Manage years, terms, levels, tracks, classes and student numbers
        * `roles.manage` - Manage staff accounts and roles
        * `students.view` - View students
        * `students.edit` - Edit students
        * `students.import` - Import students from Excel
        * `finance.configure_fees` - Configure fees
        * `finance.set_exchange_rate` - Set the exchange rate
        * `finance.grant_discount` - Grant discounts
        * `finance.collect_payment` - Collect payments
        * `finance.request_cancellation` - Request a payment cancellation
        * `finance.approve_cancellation` - Approve a payment cancellation
        * `finance.close_register` - Close a cash register
        * `finance.view_reports` - View financial reports
        * `announcements.publish` - Publish announcements
        * `audit.view` - View the audit log
    RecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: 'Affichés une seule fois : à imprimer.'
      required:
      - recovery_codes
    Role:
      type: object
