components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        starts_on:
          type: string
          format: date
          readOnly: true
          title: Start
        ends_on:
          type: string
          format: date
          readOnly: true
          title: End
        is_current:
          type: boolean
          readOnly: true
          title: Current year
        status:
          allOf:
          - $ref: '#/components/schemas/YearStatusEnum'
          readOnly: true
        terms:
          type: array
          items:
            $ref: '#/components/schemas/Term'
          readOnly: true
          description: Découpage de l'année.
      required:
      - id
      - name
      - starts_on
      - ends_on
      - is_current
      - status
      - terms
    AcademicYearCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: 'Vide : d''après les dates (« 2026-2027 »).'
          maxLength: 20
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        template:
          allOf:
          - $ref: '#/components/schemas/TemplateEnum'
          default: secondary
          description: |-
            Découpage (C1).

            * `secondary` - RDC secondary: 2 semesters, 4 periods, 2 exam sessions
            * `trimesters` - 3 terms, 6 periods, 3 exam sessions
            * `empty` - Empty: enter the terms yourself
        copy_classes_from:
          type: string
          format: uuid
          nullable: true
          description: Année dont on reprend les classes (sans les titulaires).
        copy_fees:
          type: boolean
          default: false
          description: Reprendre aussi les barèmes de cette année (droit `finance.configure_fees`).
      required:
      - ends_on
      - starts_on
    ActionEnum:
