    PatchedSchoolSettingsRequest:
      type: object
      description: Paramètres de l'école (M5). Le code (adresse) ne change que par
        le support Mwangaza.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        official_name:
          type: string
          maxLength: 255
        primary_color:
          type: string
          minLength: 1
          title: Colour
          description: 'Printed documents and the school badge, e.g. #0B5FCC.'
          maxLength: 7
        timezone:
          type: string
          minLength: 1
