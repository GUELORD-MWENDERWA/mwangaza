          type: array
          items:
            $ref: '#/components/schemas/Option'
          description: Classes de l'année (filtre).
        fee_types:
          type: array
          items:
            $ref: '#/components/schemas/Option'
          description: Types des frais dus de l'année (filtre).
        installments:
          type: array
          items:
            type: string
          description: Tranches des frais dus, par échéance (filtre).
      required:
      - students
      - enrolled
      - amounts
      - long_overdue
      - class_groups
      - fee_types
      - installments
    Validation:
      type: object
      properties:
        academic_year:
          type: string
          format: uuid
          nullable: true
        terms:
          type: array
          items:
            $ref: '#/components/schemas/Term'
        deadlines:
          type: array
          items:
            $ref: '#/components/schemas/DeadlineRow'
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/PendingSheet'
          description: Envoyées, les plus anciennes d'abord.
      required:
      - academic_year
      - terms
      - deadlines
      - sheets
    YearStatusEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
