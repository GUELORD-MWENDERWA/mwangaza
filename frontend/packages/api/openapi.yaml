  /api/class-groups/{id}/grade-sheet/:
    get:
      operationId: class_groups_grade_sheet_retrieve
      description: |-
        Fiche de cotes en PDF ou en aperçu HTML. Fiche d'un cours ou vierge : le compte note
        ce cours (qui valide les notes les lit toutes). Tableau de la classe : `grades.enter_any`,
        `grades.validate` ou titulaire de la classe. Notes pas encore validées : le document le
        dit (« provisoire »). Chaque PDF est noté dans le journal d'audit.
      parameters:
      - in: query
        name: blank_columns
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 8
        description: '`kind=blank` : colonnes vides à remplir.'
      - in: query
        name: column
        schema:
          type: string
          minLength: 1
          default: year
        description: '`kind=class` : `year`, ou l''identifiant d''une période, d''un
          examen ou d''un semestre de l''année.'
      - in: query
        name: columns
        schema:
          type: array
          items:
            enum:
            - matricule
            - totals
            type: string
            description: |-
              * `matricule` - matricule
              * `totals` - totals
        description: 'Colonnes en plus du N° et du nom (paramètre répété) : `matricule`,
          `totals` (totaux des semestres et de l''année, fiche d''un cours).'
      - in: query
        name: course
        schema:
          type: string
          format: uuid
        description: 'Cours de la classe (`kind` : `course` ou `blank`).'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: kind
        schema:
          enum:
          - course
          - blank
          - class
          type: string
          minLength: 1
        description: |-
          * `course` - course
          * `blank` - blank
          * `class` - class
        required: true
      - in: query
        name: orientation
        schema:
          enum:
          - portrait
          - landscape
          type: string
          minLength: 1
        description: |-
          Absent : le sens habituel du document.

          * `portrait` - portrait
          * `landscape` - landscape
      - in: query
        name: output
        schema:
          enum:
          - pdf
          - html
          type: string
          default: pdf
          minLength: 1
        description: |-
          * `pdf` - pdf
          * `html` - html
      - in: query
        name: paper
        schema:
          enum:
          - a4
          - a5
          type: string
          default: a4
          minLength: 1
        description: |-
          * `a4` - a4
          * `a5` - a5
      tags:
      - grades
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
          description: Document PDF (`output=pdf`).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/class-groups/{id}/report-card/:
    get:
      operationId: class_groups_report_card_retrieve
      description: |-
        Bulletin imprimable : PDF A4 ou son aperçu HTML, avec les places de la classe et un
        QR code d'authenticité ; sans `enrollment`, toute la classe (un élève par feuille) ;
        `mode=grades_only` pour le formulaire pré-imprimé ; chaque élève imprimé est noté dans le
        journal d'audit.
      parameters:
      - in: query
        name: dx
        schema:
          type: number
          format: double
          maximum: 10
          minimum: -10
          default: 0.0
        description: Décalage horizontal, en mm.
      - in: query
        name: dy
        schema:
          type: number
          format: double
          maximum: 10
          minimum: -10
          default: 0.0
        description: Décalage vertical, en mm.
      - in: query
        name: enrollment
        schema:
          type: string
          format: uuid
        description: 'Inscription de l''élève dans cette classe ; absente : toute
          la classe, un élève par feuille (PDF seulement).'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: mode
        schema:
          enum:
          - full
          - grades_only
          type: string
          default: full
          minLength: 1
        description: |-
          `grades_only` : seules les valeurs, pour le formulaire pré-imprimé.

          * `full` - full
          * `grades_only` - grades_only
      - in: query
        name: output
        schema:
          enum:
          - pdf
          - html
          type: string
          minLength: 1
        description: |-
          PDF, ou son aperçu HTML.

          * `pdf` - pdf
          * `html` - html
        required: true
      tags:
      - grades
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
          description: Document PDF (`output=pdf`).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
