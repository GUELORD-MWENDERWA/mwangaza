    PatchedConsoleAccountRequest:
      type: object
      description: |-
        Un compte vu par le super-admin. Il change les noms, le téléphone (l'identifiant de
        connexion) et l'accès ; un compte super-admin, seulement dans l'administration Django.
      properties:
        phone:
          type: string
          minLength: 1
          description: Ex. 0971234567 ou +243971234567.
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        first_name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
          title: Active
    PatchedConsolePlatformRequest:
      type: object
      description: |-
        Identité de la plateforme dans la console (5.2.2) : modifiable par le super-admin ;
        couleurs illisibles refusées (contraste 4,5 : 1). Logo et icône s'envoient à part.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        short_name:
          type: string
          minLength: 1
          description: Under the application icon on the home screen (12 characters
            is best).
          maxLength: 20
        primary_color:
          type: string
          minLength: 1
          title: Main colour
          description: Buttons and links of the interface.
          maxLength: 7
        accent_color:
          type: string
          minLength: 1
          title: Accent colour
          description: Mark and highlights on the dark menu.
          maxLength: 7
        support_phone:
          type: string
          description: '0970000000 ou +243970000000 ; vide : aucun.'
        support_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        legal_notice:
          type: string
    PatchedConsoleSchoolRequest:
      type: object
      description: |-
        Une école vue par le super-admin. Il change son adresse (`code` : l'ancienne cesse de
        marcher), ses noms et son abonnement ; couleur, fuseau, devises et logo sont réglés par
        l'école (M5). Suspendre, arrêter et réactiver passent par leurs actions ; le type d'espace
        (`environment`) est fixé à la création.
      properties:
        code:
          type: string
          minLength: 1
          description: 'Subdomain of the school: {code}.mwangaza.school. Changed by
            the platform only: the old address stops working.'
          pattern: ^[a-z0-9][a-z0-9-]{0,28}[a-z0-9]$
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 200
        official_name:
          type: string
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/SchoolStatusEnum'
          description: |-
            Essai gratuit ou active ; « suspendue » et « arrêtée » par leurs actions.

            * `trial` - Free trial
            * `active` - Active
            * `suspended` - Suspended
            * `stopped` - Stopped
            * `deleting` - Being deleted
        plan:
          type: string
          description: e.g. Discovery, Standard.
          maxLength: 50
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModulesEnum'
          description: Fonctions données à l'école (M.1) ; le socle est toujours actif.
            Retirer un module ne supprime aucune donnée.
        trial_ends_on:
          type: string
          format: date
          nullable: true
          title: End of the trial
        paid_until:
          type: string
          format: date
          nullable: true
    PatchedEnrollmentUpdateRequest:
      type: object
      properties:
        class_group:
          type: string
          format: uuid
        status:
