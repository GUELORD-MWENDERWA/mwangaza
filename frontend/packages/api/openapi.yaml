  /api/receipt-register/:
    get:
      operationId: receipt_register_retrieve
      description: |-
        Registre des reçus (DOC.3) : un reçu par ligne, par période et par caisse, totaux par caisse
        et par devise, cachet et signature du chef. Excel, PDF (3 000 reçus au plus) ou aperçu HTML ;
        chaque fichier est tracé dans le journal d'audit (noms d'élèves et montants).
      parameters:
      - in: query
        name: cash_register
        schema:
          type: string
          format: uuid
        description: 'Absent : toutes les caisses.'
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: Dernier jour (inclus), 366 jours au plus après le premier.
        required: true
      - in: query
        name: orientation
        schema:
          enum:
          - portrait
          - landscape
          type: string
          minLength: 1
        description: |-
          Absent : le sens habituel du document.

          * `portrait` - portrait
          * `landscape` - landscape
      - in: query
        name: output
        schema:
          enum:
          - xlsx
          - pdf
          - html
          type: string
          minLength: 1
        description: |-
          Excel, PDF, ou aperçu HTML du PDF.

          * `xlsx` - xlsx
          * `pdf` - pdf
          * `html` - html
        required: true
      - in: query
        name: paper
        schema:
          enum:
          - a4
          - a5
          type: string
          default: a4
          minLength: 1
        description: |-
          * `a4` - a4
          * `a5` - a5
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Premier jour (inclus).
        required: true
      tags:
      - finance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
          description: Classeur Excel.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
