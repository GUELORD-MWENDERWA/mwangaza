  /api/unpaid/:
    get:
      operationId: unpaid_list
      description: |-
        Impayés (G1) : élèves de l'année dont un frais dû est en retard (échéance passée et reste
        > 0), filtrés par classe, frais, tranche, retard et devise ; chiffres clés ; export Excel ou
        PDF (tracé dans le journal d'audit : données personnelles).
      parameters:
      - in: query
        name: academic_year
        schema:
          type: string
          format: uuid
        description: 'Absent : l''année en cours.'
      - in: query
        name: class_group
        schema:
          type: string
          format: uuid
        description: Une seule classe.
      - in: query
        name: currency
        schema:
          enum:
          - USD
          - CDF
          type: string
          minLength: 1
        description: |-
          Seulement les frais dans cette devise.

          * `USD` - US dollar
          * `CDF` - Congolese franc
      - in: query
        name: fee_type
        schema:
          type: string
          format: uuid
        description: Un seul type de frais.
      - in: query
        name: installment
        schema:
          type: string
          minLength: 1
          maxLength: 40
        description: 'Libellé de la tranche (« 1re tranche », « Octobre ») ; absent
          : toutes.'
      - in: query
        name: order
        schema:
          enum:
          - amount
          - days
          - name
          - class
          type: string
          default: amount
          minLength: 1
        description: |-
          Montant décroissant (la devise choisie, sinon les dollars puis les francs, jamais additionnés), retard décroissant, nom ou classe.

          * `amount` - amount
          * `days` - days
          * `name` - name
          * `class` - class
      - in: query
        name: over_days
        schema:
          type: integer
          maximum: 366
          minimum: 0
          default: 0
        description: 'Seulement les frais en retard de plus de ce nombre de jours
          ; 0 : tous.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - finance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUnpaidStudentList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/unpaid/export/:
    get:
      operationId: unpaid_export_retrieve
      description: |-
        Mêmes filtres que la liste : Excel (une ligne par frais en retard), PDF A4 à
        l'italienne par classe ou en liste unique, ou son aperçu HTML (pas tracé).
      parameters:
      - in: query
        name: academic_year
        schema:
          type: string
          format: uuid
        description: 'Absent : l''année en cours.'
      - in: query
        name: class_group
        schema:
          type: string
          format: uuid
        description: Une seule classe.
      - in: query
        name: currency
        schema:
          enum:
          - USD
          - CDF
          type: string
          minLength: 1
        description: |-
          Seulement les frais dans cette devise.

          * `USD` - US dollar
          * `CDF` - Congolese franc
      - in: query
        name: detail
        schema:
          type: boolean
          default: false
        description: 'PDF : une ligne par tranche.'
      - in: query
        name: fee_type
        schema:
          type: string
          format: uuid
        description: Un seul type de frais.
      - in: query
        name: group
        schema:
          enum:
          - class
          - list
          type: string
          default: class
          minLength: 1
        description: |-
          PDF : par classe ou liste unique.

          * `class` - class
          * `list` - list
      - in: query
        name: installment
        schema:
          type: string
          minLength: 1
          maxLength: 40
        description: 'Libellé de la tranche (« 1re tranche », « Octobre ») ; absent
          : toutes.'
      - in: query
        name: order
        schema:
          enum:
          - amount
          - days
          - name
          - class
          type: string
          default: amount
          minLength: 1
        description: |-
          Montant décroissant (la devise choisie, sinon les dollars puis les francs, jamais additionnés), retard décroissant, nom ou classe.

          * `amount` - amount
          * `days` - days
          * `name` - name
          * `class` - class
      - in: query
        name: orientation
        schema:
          enum:
          - portrait
          - landscape
          type: string
          minLength: 1
        description: |-
          Absent : le sens habituel du document.

          * `portrait` - portrait
          * `landscape` - landscape
      - in: query
        name: output
        schema:
          enum:
          - xlsx
          - pdf
          - html
          type: string
          minLength: 1
        description: |-
          Excel (une ligne par frais en retard), PDF, ou aperçu HTML du PDF.

          * `xlsx` - xlsx
          * `pdf` - pdf
          * `html` - html
        required: true
      - in: query
        name: over_days
        schema:
          type: integer
          maximum: 366
          minimum: 0
          default: 0
        description: 'Seulement les frais en retard de plus de ce nombre de jours
          ; 0 : tous.'
      - in: query
        name: page_per_class
        schema:
          type: boolean
          default: true
        description: 'PDF : une page par classe.'
      - in: query
        name: paper
        schema:
          enum:
          - a4
          - a5
          type: string
          default: a4
          minLength: 1
        description: |-
          * `a4` - a4
          * `a5` - a5
      - in: query
        name: phone
        schema:
          type: boolean
          default: true
        description: 'PDF : téléphone du tuteur.'
      tags:
      - finance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
          description: Classeur Excel.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
