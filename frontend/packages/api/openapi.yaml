          description: Dates and times of the school, e.g. Africa/Lubumbashi (Goma).
          maxLength: 64
        enabled_currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyEnum'
          description: Devises de l'école (au moins une).
        default_currency:
          allOf:
