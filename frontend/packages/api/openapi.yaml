          à un tiers.'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this enrollment.
        required: true
      - in: query
        name: output
        schema:
          enum:
          - pdf
          - html
          type: string
          default: pdf
          minLength: 1
        description: |-
          `html` : aperçu dans la page, code famille masqué ; `pdf` : à imprimer.

