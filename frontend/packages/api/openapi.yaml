    ConsoleSchool:
      type: object
      description: |-
        Une école vue par le super-admin. Il change son adresse (`code` : l'ancienne cesse de
        marcher), ses noms et son abonnement ; couleur, fuseau, devises et logo sont réglés par
        l'école (M5). Suspendre, arrêter et réactiver passent par leurs actions ; le type d'espace
        (`environment`) est fixé à la création.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          description: 'Subdomain of the school: {code}.mwangaza.school. Changed by
            the platform only: the old address stops working.'
          pattern: ^[a-z0-9][a-z0-9-]{0,28}[a-z0-9]$
          maxLength: 30
        name:
          type: string
          maxLength: 200
        official_name:
          type: string
          maxLength: 255
        url:
          type: string
          readOnly: true
          description: Adresse de l'école.
        environment:
          allOf:
          - $ref: '#/components/schemas/SchoolEnvironmentEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SchoolStatusEnum'
          description: |-
            Essai gratuit ou active ; « suspendue » et « arrêtée » par leurs actions.

            * `trial` - Free trial
            * `active` - Active
            * `suspended` - Suspended
            * `stopped` - Stopped
            * `deleting` - Being deleted
        plan:
          type: string
          description: e.g. Discovery, Standard.
          maxLength: 50
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModulesEnum'
          description: Fonctions données à l'école (M.1) ; le socle est toujours actif.
            Retirer un module ne supprime aucune donnée.
        trial_ends_on:
          type: string
          format: date
          nullable: true
          title: End of the trial
        paid_until:
          type: string
          format: date
          nullable: true
        enabled_currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
          title: Currencies
        default_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
          title: Main currency
          description: |-
            Currency of the reports.

            * `USD` - US dollar
            * `CDF` - Congolese franc
        student_count:
          type: integer
          readOnly: true
          description: Inscriptions actives de l'année en cours.
        last_activity_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Dernière entrée de son journal, hors support et super-admin.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - code
      - name
      - official_name
      - url
      - environment
      - status
      - plan
      - modules
      - trial_ends_on
      - paid_until
      - enabled_currencies
      - default_currency
      - student_count
      - last_activity_at
      - created_at
